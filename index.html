<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunuk Fireplace | Linkbio</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0A0A0A;
            color: #F3F4F6;
        }
        .kunuk-gradient {
            background: radial-gradient(circle at center, #1A120E 0%, #0A0A0A 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            border-color: #E65F2B;
            box-shadow: 0 10px 25px -5px rgba(230, 95, 43, 0.25);
        }
        /* Efecto de resplandor de fuego en los bordes de la pantalla */
        .fire-ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            box-shadow: inset 0 0 90px rgba(230, 95, 43, 0.15), inset 0 0 140px rgba(217, 119, 6, 0.08);
        }
    </style>
</head>

                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-gray-500 group-hover:text-emerald-500 transition-colors shrink-0"></i>
            </a>
